<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寻访模拟器 · 明日方舟抽卡</title>
<meta name="description" content="明日方舟寻访模拟器：真实概率、50 抽软保底、99 抽硬保底。非官方同人练手作品。">
<meta name="theme-color" content="#0a0c10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0c10'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23ff8a3d'%3E%E2%98%85%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0a0c10;
    --panel: #12151c;
    --panel-2: #161a23;
    --line: rgba(255, 255, 255, .08);
    --ink: #e8edf5;
    --dim: #8b96a8;
    --dimmer: #5c6675;
    --accent: #ff8a3d;
    --r3: #7f8d9e;
    --r4: #a978ff;
    --r5: #ffcc4d;
    --r6: #ff7a18;
    --ease: cubic-bezier(.22, .61, .36, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(255, 138, 61, .10), transparent 70%),
      radial-gradient(700px 400px at 90% 10%, rgba(80, 130, 255, .07), transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 40px;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 22px 16px 0;
  }

  /* ---------- 顶栏 ---------- */

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: .08em;
  }

  .brand .mark {
    color: var(--accent);
    font-size: 22px;
    line-height: 1;
  }

  .brand .tag {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .14em;
    color: var(--dimmer);
    padding: 3px 7px;
    border: 1px solid var(--line);
    border-radius: 999px;
  }

  .wallet {
    font-size: 12.5px;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .wallet b { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---------- 数据面板 ---------- */

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin: 18px 0;
  }

  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    text-align: center;
  }

  .stat b {
    display: block;
    font-size: 22px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
  }

  .stat span {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--dimmer);
  }

  .stat.six b { color: var(--r6); }

  /* ---------- 保底条 ---------- */

  .pity {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px 16px;
  }

  .pity-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    color: var(--dim);
    margin-bottom: 10px;
  }

  .pity-head b {
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    font-size: 13px;
  }

  .pity-head .warn { color: var(--r6); }

  .pity-bar {
    position: relative;
    height: 8px;
    border-radius: 99px;
    background: rgba(255, 255, 255, .06);
    overflow: hidden;
  }

  .pity-bar i {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, #ffb066, var(--r6));
    box-shadow: 0 0 14px rgba(255, 122, 24, .6);
    transition: width .45s var(--ease);
  }

  .pity-bar i.hot {
    background: linear-gradient(90deg, #ff7a18, #ff3d3d);
    box-shadow: 0 0 18px rgba(255, 61, 61, .8);
  }

  /* ---------- 按钮 ---------- */

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 18px 0;
  }

  button {
    font: inherit;
    cursor: pointer;
    border: 0;
    border-radius: 14px;
    padding: 15px 18px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: .04em;
    color: #17110c;
    background: linear-gradient(180deg, #ffb066, #ff8a3d);
    box-shadow: 0 14px 30px -14px rgba(255, 138, 61, .9), inset 0 1px 0 rgba(255, 255, 255, .45);
    transition: transform .12s var(--ease), filter .12s, opacity .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  button:hover:not(:disabled) { filter: brightness(1.06); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  button em {
    font-style: normal;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(0, 0, 0, .16);
    color: #2a1608;
  }

  button.ghost {
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--line);
    box-shadow: none;
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 14px;
  }

  button.ghost:hover { color: var(--ink); border-color: rgba(255, 255, 255, .2); }

  /* ---------- 出卡区 ---------- */

  .stage {
    min-height: 200px;
    padding: 8px 0 4px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
  }

  .grid.single {
    grid-template-columns: minmax(0, 150px);
    justify-content: center;
  }

  .hint {
    text-align: center;
    padding: 54px 0;
    font-size: 13px;
    color: var(--dimmer);
    letter-spacing: .1em;
  }

  .card {
    perspective: 900px;
    aspect-ratio: 3 / 4;
    animation: dealIn .45s var(--ease) both;
  }

  @keyframes dealIn {
    from { opacity: 0; transform: translateY(14px) scale(.94); }
    to { opacity: 1; transform: none; }
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .55s var(--ease);
  }

  .card.revealed .card-inner { transform: rotateY(180deg); }

  .face,
  .back {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }

  .back {
    display: grid;
    place-items: center;
    background:
      repeating-linear-gradient(45deg, rgba(255, 255, 255, .03) 0 6px, transparent 6px 12px),
      linear-gradient(160deg, #1b2130, #0e1219);
    border: 1px solid rgba(255, 255, 255, .1);
    color: rgba(255, 255, 255, .18);
    font-size: 26px;
    font-weight: 800;
  }

  .face {
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 10px 9px;
    border: 1px solid rgba(255, 255, 255, .14);
    background: linear-gradient(165deg, #262d3b, #141821);
  }

  .face .cls {
    font-size: 10px;
    letter-spacing: .08em;
    color: rgba(255, 255, 255, .55);
    align-self: flex-start;
    padding: 2px 6px;
    border-radius: 5px;
    background: rgba(0, 0, 0, .28);
  }

  .face .name {
    font-size: 15px;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: .02em;
    text-align: center;
    color: #fff;
    word-break: break-all;
  }

  .face .stars {
    font-size: 10px;
    letter-spacing: .06em;
    text-align: center;
    color: rgba(255, 255, 255, .8);
    white-space: nowrap;
  }

  /* 稀有度配色 */

  .card.r3 .face {
    background: linear-gradient(165deg, #2b323d, #161a20);
  }
  .card.r3 .stars { color: #a8b6c4; }

  .card.r4 .face {
    background: linear-gradient(165deg, #3a2b55, #1c1526);
    border-color: rgba(169, 120, 255, .45);
    box-shadow: 0 0 22px -6px rgba(169, 120, 255, .55) inset;
  }
  .card.r4 .stars { color: #c9a6ff; }

  .card.r5 .face {
    background: linear-gradient(165deg, #4a3c1c, #241d0f);
    border-color: rgba(255, 204, 77, .5);
    box-shadow: 0 0 24px -6px rgba(255, 204, 77, .55) inset;
  }
  .card.r5 .stars { color: #ffd97a; }

  .card.r6 .face {
    background: linear-gradient(165deg, #5a2c0c, #2a1407);
    border-color: rgba(255, 122, 24, .7);
    box-shadow: 0 0 30px -4px rgba(255, 122, 24, .7) inset;
  }
  .card.r6 .stars { color: #ffb066; }

  .card.r6 {
    animation: dealIn .45s var(--ease) both, sixGlow 1.8s ease-in-out .6s infinite;
  }

  @keyframes sixGlow {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(255, 122, 24, 0)); }
    50% { filter: drop-shadow(0 0 14px rgba(255, 122, 24, .75)); }
  }

  .card.r6 .face::after {
    content: "";
    position: absolute;
    inset: -40% -60%;
    background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, .5) 50%, transparent 60%);
    transform: translateX(-120%);
    animation: shine 1.5s var(--ease) .8s infinite;
  }

  @keyframes shine {
    to { transform: translateX(120%); }
  }

  /* ---------- 本次结果 ---------- */

  .summary {
    margin-top: 14px;
    text-align: center;
    font-size: 13px;
    color: var(--dim);
    min-height: 20px;
    letter-spacing: .04em;
  }

  .summary b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .summary .s6 { color: var(--r6); }
  .summary .s5 { color: var(--r5); }

  /* ---------- 记录 ---------- */

  .history {
    margin-top: 26px;
    border-top: 1px solid var(--line);
    padding-top: 18px;
  }

  .history h2 {
    font-size: 13px;
    letter-spacing: .16em;
    color: var(--dimmer);
    margin: 0 0 12px;
    font-weight: 600;
  }

  .log {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 260px;
    overflow-y: auto;
  }

  .log li {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: var(--dim);
    padding: 8px 12px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
  }

  .log li .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: 0 0 auto;
  }

  .log li .dot.d6 { background: var(--r6); box-shadow: 0 0 9px var(--r6); }
  .log li .dot.d5 { background: var(--r5); }
  .log li .dot.d4 { background: var(--r4); }
  .log li .dot.d3 { background: var(--r3); }

  .log li .txt {
    flex: 1;
    min-width: 0;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .log li .time { color: var(--dimmer); font-size: 11px; font-variant-numeric: tabular-nums; }

  .empty { font-size: 12.5px; color: var(--dimmer); }

  /* ---------- 底部 ---------- */

  footer {
    margin-top: 26px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: var(--dimmer);
  }

  /* ---------- 六星闪光 ---------- */

  .flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at 50% 45%, rgba(255, 170, 80, .55), transparent 65%);
    opacity: 0;
    z-index: 50;
  }

  .flash.on { animation: flashOut .6s ease-out; }

  @keyframes flashOut {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---------- 响应式 ---------- */

  @media (max-width: 760px) {
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .brand { font-size: 16px; }
  }

  @media (max-width: 430px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .actions { grid-template-columns: 1fr; }
    .face .name { font-size: 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <span class="mark">★</span>
      寻访模拟器
      <span class="tag">非官方</span>
    </div>
    <div class="wallet">合成玉 <b>∞</b>　·　单抽 600</div>
  </header>

  <section class="stats" aria-label="统计">
    <div class="stat"><b id="totalPulls">0</b><span>累计寻访</span></div>
    <div class="stat six"><b id="sixCount">0</b><span>六星干员</span></div>
    <div class="stat"><b id="sixRate">—</b><span>六星出率</span></div>
    <div class="stat"><b id="avgPulls">—</b><span>平均出货</span></div>
  </section>

  <div class="pity">
    <div class="pity-head">
      <span>保底进度 · 距硬保底</span>
      <span><b id="pityText">0 / 99</b>　<span id="pityRate">当前六星 2.0%</span></span>
    </div>
    <div class="pity-bar"><i id="pityFill"></i></div>
  </div>

  <div class="actions">
    <button id="pull1" type="button">寻访一次 <em>600</em></button>
    <button id="pull10" type="button">寻访十次 <em>6000</em></button>
  </div>

  <div class="stage" id="stage">
    <div class="hint">按下按钮，开始寻访</div>
  </div>

  <div class="summary" id="summary"></div>

  <section class="history">
    <h2>寻访记录</h2>
    <ul class="log" id="log"></ul>
    <div class="empty" id="empty">还没有记录</div>
  </section>

  <footer>
    <span>非官方同人练习作品，干员名称与设定版权归鹰角网络所有</span>
    <span><button class="ghost" id="resetBtn" type="button">重置数据</button></span>
  </footer>
</div>

<div class="flash" id="flash" aria-hidden="true"></div>

<script>
(() => {
  'use strict';

  /* ================= 概率模型 ================= */

  // #region gacha-math
  const SIX_BASE = 0.02;      // 六星基础概率
  const PITY_START = 50;      // 连续 50 抽未出六星后开始加成
  const PITY_STEP = 0.02;     // 每抽 +2%
  const HARD_PITY = 99;       // 第 99 抽必定六星

  /** 第 sinceSix+1 抽的六星概率（sinceSix = 已经连续多少抽没出六星） */
  function sixRate(sinceSix) {
    if (sinceSix < PITY_START) return SIX_BASE;
    const p = SIX_BASE + PITY_STEP * (sinceSix - PITY_START + 1);
    return Math.min(1, p);
  }

  /** 用一次随机数决定稀有度；保底加成只提升六星，其余档位等比压缩 */
  function drawRarity(sinceSix, r) {
    const p6 = sixRate(sinceSix);
    if (p6 >= 1) return 6;
    const scale = (1 - p6) / 0.98;
    const p5 = 0.08 * scale;
    const p4 = 0.50 * scale;
    if (r < p6) return 6;
    if (r < p6 + p5) return 5;
    if (r < p6 + p5 + p4) return 4;
    return 3;
  }
  // #endregion

  /* ================= 干员池 ================= */

  const POOL = {
    6: [
      ['银灰', '近卫'], ['艾雅法拉', '术师'], ['能天使', '狙击'], ['推进之王', '先锋'],
      ['伊芙利特', '术师'], ['星熊', '重装'], ['闪灵', '医疗'], ['夜莺', '医疗'],
      ['塞雷娅', '重装'], ['安洁莉娜', '辅助'], ['陈', '近卫'], ['斯卡蒂', '近卫'],
      ['黑', '狙击'], ['莫斯提马', '术师'], ['赫拉格', '近卫'], ['煌', '近卫'],
      ['铃兰', '辅助'], ['泥岩', '重装'], ['山', '近卫'], ['凯尔希', '医疗']
    ],
    5: [
      ['白面鸮', '医疗'], ['德克萨斯', '先锋'], ['蓝毒', '狙击'], ['拉普兰德', '近卫'],
      ['天火', '术师'], ['可颂', '重装'], ['幽灵鲨', '近卫'], ['星极', '近卫'],
      ['临光', '重装'], ['陨星', '狙击'], ['华法琳', '医疗'], ['狮蝎', '特种'],
      ['崖心', '特种'], ['初雪', '辅助'], ['真理', '辅助'], ['普罗旺斯', '狙击']
    ],
    4: [
      ['讯使', '先锋'], ['清道夫', '先锋'], ['红豆', '先锋'], ['白雪', '狙击'],
      ['流星', '狙击'], ['夜烟', '术师'], ['远山', '术师'], ['蛇屠箱', '重装'],
      ['角峰', '重装'], ['调香师', '医疗'], ['苏苏洛', '医疗'], ['暗索', '特种'],
      ['阿消', '特种'], ['砾', '重装'], ['梅', '狙击'], ['宴', '近卫']
    ],
    3: [
      ['芬', '先锋'], ['香草', '先锋'], ['翎羽', '先锋'], ['克洛丝', '狙击'],
      ['米格鲁', '重装'], ['卡缇', '重装'], ['安赛尔', '医疗'], ['芙蓉', '医疗'],
      ['炎熔', '术师'], ['史都华德', '术师'], ['玫兰莎', '近卫'], ['泡普卡', '近卫'],
      ['空爆', '狙击'], ['月见夜', '近卫'], ['斑点', '重装'], ['梓兰', '辅助']
    ]
  };

  const STORE_KEY = 'arknights.gacha.v1';

  /* ================= 状态 ================= */

  let state = { total: 0, six: 0, sinceSix: 0 };
  let log = [];
  let busy = false;

  const el = {
    total: document.getElementById('totalPulls'),
    six: document.getElementById('sixCount'),
    rate: document.getElementById('sixRate'),
    avg: document.getElementById('avgPulls'),
    pityText: document.getElementById('pityText'),
    pityRate: document.getElementById('pityRate'),
    pityFill: document.getElementById('pityFill'),
    stage: document.getElementById('stage'),
    summary: document.getElementById('summary'),
    log: document.getElementById('log'),
    empty: document.getElementById('empty'),
    pull1: document.getElementById('pull1'),
    pull10: document.getElementById('pull10'),
    reset: document.getElementById('resetBtn'),
    flash: document.getElementById('flash')
  };

  /* ================= 存档 ================= */

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (!data || typeof data !== 'object') return;
      state.total = Number(data.total) || 0;
      state.six = Number(data.six) || 0;
      state.sinceSix = Number(data.sinceSix) || 0;
      log = Array.isArray(data.log) ? data.log.slice(0, 40) : [];
    } catch (_) { /* 忽略损坏的存档 */ }
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ ...state, log: log.slice(0, 40) }));
    } catch (_) { /* 隐私模式 */ }
  }

  /* ================= 渲染 ================= */

  function fmtPct(v) { return (v * 100).toFixed(1) + '%'; }

  function renderStats() {
    el.total.textContent = String(state.total);
    el.six.textContent = String(state.six);
    el.rate.textContent = state.total ? fmtPct(state.six / state.total) : '—';
    el.avg.textContent = state.six ? (state.total / state.six).toFixed(1) : '—';

    const since = state.sinceSix;
    el.pityText.textContent = since + ' / ' + HARD_PITY;
    el.pityFill.style.width = Math.min(100, (since / HARD_PITY) * 100).toFixed(1) + '%';
    el.pityFill.classList.toggle('hot', since >= PITY_START);

    const p = sixRate(since);
    el.pityRate.textContent = '当前六星 ' + fmtPct(p);
    el.pityRate.className = p > SIX_BASE + 0.0001 ? 'warn' : '';
  }

  function renderLog() {
    el.log.textContent = '';
    el.empty.style.display = log.length ? 'none' : '';
    for (const item of log.slice(0, 20)) {
      const li = document.createElement('li');
      const dot = document.createElement('i');
      dot.className = 'dot d' + item.rarity;
      const txt = document.createElement('span');
      txt.className = 'txt';
      txt.textContent = '★'.repeat(item.rarity) + ' ' + item.name + ' · ' + item.cls;
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = item.time;
      li.append(dot, txt, time);
      el.log.appendChild(li);
    }
  }

  /* ================= 抽卡 ================= */

  function pickOne(rarity) {
    const pool = POOL[rarity];
    const [name, cls] = pool[Math.floor(Math.random() * pool.length)];
    return { rarity, name, cls };
  }

  function pull(n) {
    if (busy) return;
    busy = true;
    el.pull1.disabled = true;
    el.pull10.disabled = true;

    const results = [];
    for (let i = 0; i < n; i++) {
      const rarity = drawRarity(state.sinceSix, Math.random());
      state.total++;
      if (rarity === 6) {
        state.six++;
        state.sinceSix = 0;
      } else {
        state.sinceSix++;
      }
      results.push(pickOne(rarity));
    }
    save();

    el.stage.textContent = '';
    const grid = document.createElement('div');
    grid.className = 'grid' + (n === 1 ? ' single' : '');
    el.stage.appendChild(grid);

    const cards = [];
    for (let i = 0; i < results.length; i++) {
      const r = results[i];
      const card = document.createElement('div');
      card.className = 'card r' + r.rarity;
      card.style.animationDelay = (i * 60) + 'ms';

      const inner = document.createElement('div');
      inner.className = 'card-inner';

      const back = document.createElement('div');
      back.className = 'back';
      back.textContent = '★';

      const face = document.createElement('div');
      face.className = 'face';
      const cls = document.createElement('span');
      cls.className = 'cls';
      cls.textContent = r.cls;
      const name = document.createElement('b');
      name.className = 'name';
      name.textContent = r.name;
      const stars = document.createElement('span');
      stars.className = 'stars';
      stars.textContent = '★'.repeat(r.rarity);
      face.append(cls, name, stars);

      inner.append(back, face);
      card.appendChild(inner);
      grid.appendChild(card);
      cards.push(card);
    }

    // 逐张翻开
    let shown = 0;
    let shownSix = 0;
    results.forEach((r, i) => {
      setTimeout(() => {
        cards[i].classList.add('revealed');
        shown++;
        if (r.rarity === 6) {
          shownSix++;
          flashScreen();
          blip([523.25, 659.25, 783.99, 1046.5], 0.09, 'triangle');
        } else if (r.rarity === 5) {
          blip([523.25, 659.25], 0.07, 'sine');
        } else {
          blip([330], 0.04, 'sine');
        }
        updateSummary(results, shown, shownSix);
        if (shown === results.length) {
          finishTurn(results);
        }
      }, 220 + i * 140);
    });

    // 记录（整批一条）
    const counts = { 6: 0, 5: 0, 4: 0, 3: 0 };
    results.forEach((r) => { counts[r.rarity]++; });
    const top = results.filter((r) => r.rarity === 6).map((r) => r.name);
    const label = n + ' 抽' + (top.length ? ' · 六星 ' + top.join('、') : '');
    log.unshift({
      name: label,
      cls: '6★ ' + counts[6] + ' / 5★ ' + counts[5] + ' / 4★ ' + counts[4] + ' / 3★ ' + counts[3],
      rarity: top.length ? 6 : counts[5] ? 5 : 4,
      time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
    });
    log = log.slice(0, 40);
    renderLog();
    save();
  }

  function updateSummary(results, shown, shownSix) {
    const c = { 6: 0, 5: 0, 4: 0, 3: 0 };
    for (let i = 0; i < shown; i++) c[results[i].rarity]++;
    el.summary.innerHTML =
      '本次：' +
      '<b class="s6">6★ ' + c[6] + '</b> · ' +
      '<b class="s5">5★ ' + c[5] + '</b> · ' +
      '<b>4★ ' + c[4] + '</b> · ' +
      '<b>3★ ' + c[3] + '</b>';
  }

  function finishTurn() {
    renderStats();
    busy = false;
    el.pull1.disabled = false;
    el.pull10.disabled = false;
  }

  /* ================= 音效 ================= */

  let audioCtx = null;

  function blip(freqs, dur, type) {
    try {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();
      }
      const now = audioCtx.currentTime;
      freqs.forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = f;
        const t0 = now + idx * 0.09;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.12, t0 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.18);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.2);
      });
    } catch (_) { /* 音效失败不影响抽卡 */ }
  }

  /* ================= 六星闪光 ================= */

  function flashScreen() {
    el.flash.classList.remove('on');
    void el.flash.offsetWidth;
    el.flash.classList.add('on');
  }

  /* ================= 绑定 ================= */

  el.pull1.addEventListener('click', () => pull(1));
  el.pull10.addEventListener('click', () => pull(10));

  el.reset.addEventListener('click', () => {
    if (busy) return;
    state = { total: 0, six: 0, sinceSix: 0 };
    log = [];
    save();
    renderStats();
    renderLog();
    el.summary.textContent = '';
    el.stage.textContent = '';
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = '已重置，重新开始';
    el.stage.appendChild(hint);
  });

  load();
  renderStats();
  renderLog();
})();
</script>
</body>
